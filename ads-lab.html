<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ads Lab simulatore campagne</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
/* Layout: stepper a sinistra · lavoro al centro · spiegazioni a destra */
:root{
  --paper:#f4f5f1; --surface:#ffffff; --ink:#18201d; --muted:#5b6761; --line:#dce1db;
  --accent:#0d6b5c; --accent-ink:#ffffff; --accent-soft:#e1efea; --mark:#f3c94b; --mark-soft:#fdf3d2;
  --good:#2b7a4b; --warn:#a96300; --bad:#bf3a2b; --good-soft:#e3f2e8; --warn-soft:#fbefdc; --bad-soft:#f8e3df;
  --link:#1a4fb4; --serp-url:#1f6b37;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111513; --surface:#1a201d; --ink:#e7ece9; --muted:#9aa7a0; --line:#2c3631;
    --accent:#45b89f; --accent-ink:#06201a; --accent-soft:#1b332d; --mark:#e8bd3c; --mark-soft:#332b14;
    --good:#5cc489; --warn:#e3a243; --bad:#ef7a69; --good-soft:#18301f; --warn-soft:#33270f; --bad-soft:#3a1d18;
    --link:#8ab4f8; --serp-url:#7fcf9a; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111513; --surface:#1a201d; --ink:#e7ece9; --muted:#9aa7a0; --line:#2c3631;
  --accent:#45b89f; --accent-ink:#06201a; --accent-soft:#1b332d; --mark:#e8bd3c; --mark-soft:#332b14;
  --good:#5cc489; --warn:#e3a243; --bad:#ef7a69; --good-soft:#18301f; --warn-soft:#33270f; --bad-soft:#3a1d18;
  --link:#8ab4f8; --serp-url:#7fcf9a; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:26px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:-.01em}
.brand b i{font-style:normal;background:var(--mark);color:#1c1a10;padding:0 5px;border-radius:4px;margin-left:2px}
.brand span{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* app grid */
.app{display:grid;grid-template-columns:210px minmax(0,1fr) 300px;gap:24px;padding:24px 20px 60px;max-width:1440px;margin:0 auto}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;position:sticky;top:84px;align-self:start}
.steps button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted)}
.steps button .n{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:500 12px var(--f-mono)}
.steps button.done .n{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.steps button.cur{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.steps button.cur .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps button:disabled{cursor:not-allowed;opacity:.5}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.help{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 100px);overflow:auto}
.help .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.help .box h3{font-size:15px}
.help .lab{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.help .err{background:var(--bad-soft);border-color:transparent}
.help .tip{background:var(--mark-soft);border-color:transparent}
.help ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card > header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card > header h3{flex:1}
.lead{color:var(--muted);max-width:68ch}
.field{display:flex;flex-direction:column;gap:6px}
.field > label, .lbl{font-weight:600;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 11px}
textarea{resize:vertical;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.cnt{font:12px var(--f-mono);color:var(--muted);text-align:right}
.cnt.over{color:var(--bad);font-weight:600}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > *{flex:1;min-width:160px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.inp{position:relative}
.inp .cnt{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;background:var(--paper);padding-left:4px}
.inp input{padding-right:52px}

/* option tiles */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.opt{position:relative;display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block;font-size:14px}
.opt small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.opt.dim{opacity:.7}
.list{display:flex;flex-direction:column;gap:8px}
.list .opt{grid-template-columns:auto 1fr}

/* scenarios */
.scen{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.sc{border:1.5px solid var(--line);border-radius:12px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.sc:hover{border-color:var(--accent)}
.sc.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sc .k{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sc h3{font-size:18px}
.sc p{font-size:14px;color:var(--muted)}
.sc .lvl{font-size:12px;color:var(--muted)}
.brief{border-left:4px solid var(--mark);background:var(--mark-soft);border-radius:0 10px 10px 0;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.brief dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0;font-size:14px}
.brief dt{color:var(--muted)}
.brief dd{margin:0;font-weight:500}

/* keyword live */
.kwlive{display:flex;flex-wrap:wrap;gap:6px}
.kw{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:13px;background:var(--paper)}
.mt{font:600 10px var(--f-mono);padding:1px 5px;border-radius:4px;letter-spacing:.03em}
.mt.broad{background:var(--warn-soft);color:var(--warn)}
.mt.phrase{background:var(--accent-soft);color:var(--accent)}
.mt.exact{background:var(--good-soft);color:var(--good)}
.kw.blk{text-decoration:line-through;opacity:.65}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.ideas td{vertical-align:middle}

/* ad preview */
.adwrap{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:start}
.serp{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--surface);font-family:Arial, Helvetica, sans-serif;display:flex;flex-direction:column;gap:4px}
.serp .sp1{display:flex;gap:8px;align-items:center;font-size:13px}
.serp .sp1 b{font-weight:700}
.serp .fav{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font:700 12px Arial;color:var(--accent)}
.serp .u{font-size:12px;color:var(--muted)}
.serp .t{font-size:19px;color:var(--link);line-height:1.3}
.serp .d{font-size:14px;color:var(--ink);opacity:.85}
.serp .sl{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--link);margin-top:4px}
.serp .co{font-size:13px;color:var(--muted)}
.serp .ph{font-size:13px;color:var(--ink)}
.strength{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.meter i{height:8px;border-radius:4px;background:var(--line)}
.strength ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hl-kw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.hl-kw .y{background:var(--good-soft);color:var(--good)}
.hl-kw .n{background:var(--paper);color:var(--muted)}
.hl-kw span{padding:2px 8px;border-radius:999px}

/* nav */
.nav{display:flex;justify-content:space-between;gap:10px}

/* alerts */
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:14px}
.al.ok{background:var(--good-soft)} .al.warn{background:var(--warn-soft)} .al.bad{background:var(--bad-soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

/* results */
.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.ring{--p:0;width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%), var(--line) 0);display:grid;place-items:center}
.ring > div{width:104px;height:104px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.ring b{font:700 36px var(--f-display);line-height:1}
.ring small{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--paper)}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font:500 21px var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;height:28px;border-radius:8px;overflow:hidden;background:var(--line)}
.stack > div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.cat{display:flex;flex-direction:column;gap:8px}
.cat > header{display:flex;align-items:center;gap:10px}
.cat > header h3{flex:1;font-size:16px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.pts{font:500 13px var(--f-mono);color:var(--muted);white-space:nowrap}
.qs{display:inline-grid;place-items:center;width:26px;height:22px;border-radius:5px;font:600 12px var(--f-mono)}
.qs.h{background:var(--good-soft);color:var(--good)} .qs.m{background:var(--warn-soft);color:var(--warn)} .qs.l{background:var(--bad-soft);color:var(--bad)}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--good-soft);color:var(--good)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.mut{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.fine{font-size:12px;color:var(--muted)}
.top3{counter-reset:t;display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.top3 li{counter-increment:t;display:grid;grid-template-columns:28px 1fr;gap:8px;font-size:14px}
.top3 li::before{content:counter(t);width:24px;height:24px;border-radius:50%;background:var(--mark);color:#1c1a10;display:grid;place-items:center;font:700 12px var(--f-mono)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,14,12,.5);display:none;place-items:center;z-index:20;padding:16px}
.ov.on{display:grid}
.modal{background:var(--surface);border-radius:14px;max-width:720px;width:100%;max-height:85vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.modal dl{margin:0;display:flex;flex-direction:column;gap:10px}
.modal dt{font-weight:600}
.modal dd{margin:0;color:var(--muted);font-size:14px}
.modal textarea{min-height:240px;font:13px var(--f-mono)}

@media (max-width:1180px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  .help{grid-column:2;position:static;max-height:none}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr;padding:16px}
  .steps{flex-direction:row;overflow-x:auto;position:static;gap:4px}
  .steps button{white-space:nowrap}
  .help{grid-column:1}
  .adwrap,.grid2,.hero{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){
  .bar i,.stack > div{transition:width .5s ease}
}

/* ===== Ritocchi di visualizzazione: aiuto richiudibile, navigazione sempre visibile, mobile compatto ===== */
.cred-m{display:none}
.helpm{display:none;background:var(--mark-soft);border-radius:12px;padding:0}
.helpm summary{cursor:pointer;list-style:none;padding:12px 16px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.helpm summary::-webkit-details-marker{display:none}
.helpm summary::before{content:"?";width:22px;height:22px;flex:none;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:600 12px var(--f-mono)}
.helpm summary::after{content:"Apri";margin-left:auto;font:500 12px var(--f-mono);color:var(--muted)}
.helpm[open] summary::after{content:"Chiudi"}
.helpm .hb{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.helpm .hb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.helpm .hb table{font-size:13px}
.helpm .hx{border-radius:8px;padding:10px 12px;font-size:14px}
.helpm .hx.e{background:var(--bad-soft)} .helpm .hx.t{background:var(--surface)}
.helpm .hx b{display:block;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.nav{position:sticky;bottom:0;z-index:3;padding:16px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--paper) 40%)}
.nav .btn{box-shadow:0 1px 2px rgba(0,0,0,.06)}
@media (max-width:1180px){
  .help{display:none}
  .helpm{display:block}
  .app{grid-template-columns:200px minmax(0,1fr)}
}
@media (max-width:820px){
  .top{position:static;padding:10px 16px;gap:8px 10px}
  .brand > span:not(.cred-m){display:none}
  .cred-m{display:inline;font-size:12px;color:var(--muted)}
  .top .sp{flex-basis:100%;height:0}
  #scChip{flex:1;min-width:0}
  #scChip .chip{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block;text-align:left}
  .app{grid-template-columns:1fr;padding:0 16px 24px;gap:14px}
  .steps{position:sticky;top:0;z-index:4;background:var(--paper);margin:0 -16px;padding:8px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
  .steps::-webkit-scrollbar{display:none}
  .steps button{padding:6px 10px}
  main{gap:14px}
  .card{padding:16px;border-radius:12px;gap:12px}
  h2{font-size:22px}
  .lead{font-size:14px}
  table{font-size:13px}
  th,td{padding:7px 8px}
  .hero{justify-items:start;gap:14px}
  .ring{width:112px;height:112px}.ring > div{width:88px;height:88px}.ring b{font-size:30px}
  .kpi b{font-size:18px}
  .nav .btn{flex:1;padding:12px}
  .nav .btn[style*="hidden"]{flex:0;padding:0;border:0;width:0}
  #phone{align-items:center!important;width:100%}
  .modal{padding:18px;max-height:90vh}
}
.top a.btn{white-space:nowrap}
@media (max-width:820px){#scChip{flex:1 1 100%}}
.term{text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:help;border-radius:3px}
.term:focus-visible{outline:2px solid var(--mark)}
#tip{position:absolute;z-index:40;display:none;background:var(--ink);color:var(--paper);font:13px/1.45 var(--f-body);padding:8px 11px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);pointer-events:none}
.exbox{flex-direction:row;align-items:center;gap:14px;background:var(--mark-soft);border-color:transparent}
.exbox > div{flex:1}
@media (max-width:820px){.exbox{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><b>Ads<i>Lab</i></b><span>Simulatore didattico di campagne sulla Rete di Ricerca · creato da <b style="font:600 13px var(--f-body);color:var(--ink)">Azzurra Curcio</b></span><span class="cred-m">di Azzurra Curcio</span></div>
  <span class="sp"></span>
  <span id="scChip"></span>
  <a class="btn sm" href="index.html" style="text-decoration:none;color:inherit">← Campagna Zero</a>
  <button class="btn sm" id="bGloss" type="button">Glossario</button>
  <button class="btn sm ghost" id="bReset" type="button">Ricomincia</button>
</div>

<div class="app">
  <ol class="steps" id="steps"></ol>
  <main id="view"></main>
  <aside class="help" id="help"></aside>
</div>

<div class="ov" id="ov"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
/* ============ DATI ============ */
const LOCS=[
 {id:'mondo',t:'Tutti i paesi e i territori'},
 {id:'italia',t:'Italia'},
 {id:'lombardia',t:'Lombardia (regione)'},
 {id:'milano',t:'Milano (città)'},
 {id:'milano_navigli',t:'Milano – raggio 3 km dai Navigli'},
 {id:'piemonte',t:'Piemonte (regione)'},
 {id:'torino',t:'Torino (città)'},
 {id:'torino_crocetta',t:'Torino – raggio 5 km da Crocetta'}
];
const GOALS=[
 {id:'vendite',t:'Vendite',d:'Ordini e acquisti online, in app, per telefono o in negozio.'},
 {id:'lead',t:'Lead',d:'Contatti: moduli compilati, chiamate, prenotazioni, iscrizioni.'},
 {id:'traffico',t:'Traffico al sito web',d:'Portare sul sito persone interessate.'},
 {id:'considerazione',t:'Considerazione del prodotto e del brand',d:'Far scoprire prodotti e servizi a chi sta valutando.'},
 {id:'notorieta',t:'Notorietà del brand e copertura',d:'Farsi conoscere da più persone possibile.'},
 {id:'nessuno',t:'Crea una campagna senza un obiettivo',d:'Scegli tu tutte le impostazioni, senza suggerimenti.'}
];

const HELP=[
 {t:'Il brief del cliente',b:'<p>Ogni scenario è un cliente vero e proprio. Prima di aprire Google Ads un professionista raccoglie: <b>cosa vende</b>, <b>dove</b>, <b>a chi</b>, <b>quanto può spendere</b> e <b>cosa conta come risultato</b>.</p><p>Tutte le scelte dei passaggi successivi vanno ricondotte a queste informazioni: la valutazione finale le confronta con il brief.</p>',e:'Partire a costruire la campagna senza rileggere il brief: località e budget sbagliati sono gli errori più costosi.',p:'Tieni il brief aperto: lo trovi in alto in ogni passaggio, cliccando sul nome del cliente.'},
 {t:'Obiettivo e tipo di campagna',b:'<p>L\'<b>obiettivo</b> dice a Google che risultato ti interessa: in base a questo ti propone impostazioni e strategie di offerta.</p><p>La campagna sulla <b>Rete di Ricerca</b> mostra annunci di testo nei risultati di Google quando qualcuno cerca qualcosa di collegato alle tue parole chiave. È il tipo migliore per iniziare: intercetti chi sta già cercando.</p><p>Il <b>nome</b> serve a te: usa uno schema fisso, ad esempio <span class="mono">Search – Pizza domicilio – Milano</span>.</p>',e:'Scegliere "Traffico al sito web" quando il cliente vuole vendite o contatti: ottieni visite, non clienti.',p:'Con l\'obiettivo giusto Google ottimizza per ciò che il cliente misura davvero.'},
 {t:'Reti, AI Max, località e lingue',b:'<p><b>Reti</b>: di base Google aggiunge la <b>Rete Display</b> (banner su siti e app) e i <b>partner di ricerca</b> (altri motori e siti di ricerca). Il Display funziona in modo molto diverso dalla ricerca: chi vede un banner non sta cercando te.</p><p><b>AI Max</b>: dal 2025–2026 è attivo di default nelle nuove campagne di ricerca. Amplia le ricerche oltre le parole chiave, personalizza i titoli e può scegliere un\'altra pagina del sito. Rende di più con offerte basate sulle conversioni e va tenuto sotto controllo con le parole chiave negative e il report dei termini di ricerca.</p><p><b>Località</b>: indica dove si trovano i clienti che puoi servire. <b>Presenza</b> = persone che si trovano lì. <b>Presenza o interesse</b> = anche persone altrove che hanno cercato quel luogo.</p><p><b>Lingue</b>: la lingua impostata dagli utenti su Google.</p>',e:'Lasciare attiva la Rete Display e la località "Italia" per un\'attività di quartiere: metà del budget va a persone che non possono diventare clienti.',p:'Per attività locali scegli il raggio o la città e l\'opzione "Presenza".'},
 {t:'Budget e strategia di offerta',b:'<p>In Google Ads imposti un <b>budget giornaliero medio</b>. Per ottenerlo dividi il budget mensile per <b>30,4</b> (giorni medi in un mese). In un singolo giorno Google può spendere fino al doppio, ma nel mese non supera mai budget × 30,4.</p><p>La <b>strategia di offerta</b> decide quanto offrire in ogni asta:</p><ul><li><b>Massimizza i clic</b>: più visite possibile.</li><li><b>Massimizza le conversioni</b>: più risultati possibile (serve il monitoraggio).</li><li><b>CPA / ROAS target</b>: funzionano bene solo con uno storico di conversioni (indicativamente 30 in 30 giorni).</li><li><b>CPC manuale</b>: decidi tu, ma devi gestirlo ogni giorno.</li></ul>',e:'Inserire il budget mensile nel campo del budget giornaliero, o impostare un CPA target su un account nuovo.',p:'Account nuovo con conversioni monitorate: parti con "Massimizza le conversioni".'},
 {t:'Parole chiave',b:'<p>Le <b>parole chiave</b> sono i termini per cui vuoi comparire. Il <b>tipo di corrispondenza</b> decide quanto possono essere diverse le ricerche reali:</p><table><tr><th>Scrivi</th><th>Tipo</th></tr><tr><td class="mono">pizza domicilio</td><td>Generica: anche ricerche solo correlate</td></tr><tr><td class="mono">"pizza domicilio"</td><td>A frase: ricerche che contengono il significato</td></tr><tr><td class="mono">[pizza domicilio]</td><td>Esatta: stesso significato</td></tr></table><p>Le <b>parole chiave negative</b> escludono ricerche che non vuoi (es. <span class="mono">ricetta</span>, <span class="mono">lavoro</span>).</p><p>Ogni <b>gruppo di annunci</b> raccoglie parole chiave di un solo tema (5–20) con un annuncio dedicato.</p>',e:'Usare una sola parola generica a corrispondenza generica (es. pizza): compari per ricette, offerte di lavoro, corsi…',p:'Pensa a cosa scrive chi è pronto a comprare: servizio + luogo, prodotto + "prezzo", "online", "vicino a me".'},
 {t:'Annunci adattabili della rete di ricerca',b:'<p>Scrivi fino a <b>15 titoli</b> (max 30 caratteri) e <b>4 descrizioni</b> (max 90). Google li combina e mostra di volta in volta 2–3 titoli e 1–2 descrizioni.</p><p>Ogni titolo deve stare in piedi da solo. Alterna:</p><ul><li>la parola chiave del gruppo</li><li>benefici e punti di forza</li><li>offerte e prezzi</li><li>un invito all\'azione (Ordina, Prenota, Prova…)</li></ul><p>L\'<b>URL finale</b> è la pagina dove arriva chi clicca: deve essere la più pertinente, non per forza la home.</p>',e:'Scrivere 3 titoli quasi uguali o usare il punto esclamativo nei titoli (non è consentito dalle norme pubblicitarie).',p:'Per iniziare bastano 8 titoli diversi e 3 descrizioni: è già un\'efficacia "Buona". Puoi arrivare a 15 titoli quando hai più idee.'},
 {t:'Asset (ex estensioni)',b:'<p>Gli <b>asset</b> aggiungono informazioni all\'annuncio, lo rendono più grande e di solito aumentano la percentuale di clic. Aggiungerli non costa nulla.</p><ul><li><b>Sitelink</b>: link ad altre pagine del sito.</li><li><b>Callout</b>: brevi frasi sui punti di forza ("Consegna gratuita").</li><li><b>Chiamata</b>: il numero di telefono, cliccabile da smartphone.</li><li><b>Snippet strutturati</b>: un elenco sotto un\'intestazione (es. Servizi: …).</li></ul>',e:'Saltare gli asset: l\'annuncio risulta più piccolo di quelli dei concorrenti.',p:'Almeno 4 sitelink e 4 callout. Per attività che ricevono telefonate, sempre l\'asset di chiamata.'},
 {t:'Controllo finale',b:'<p>Prima di pubblicare un professionista ricontrolla: obiettivo, reti, località, budget, strategia, parole chiave, annunci e asset.</p><p>Quando pubblichi, il simulatore stima <b>30 giorni</b> di risultati e assegna un punteggio su 100 con i consigli per migliorare.</p>',e:'Pubblicare con un gruppo di annunci senza annuncio o senza parole chiave.',p:'Puoi modificare la campagna e ripubblicarla quante volte vuoi: confronta i punteggi tra un tentativo e l\'altro.'},
 {t:'Leggere i risultati',b:'<ul><li><b>Impressioni</b>: quante volte l\'annuncio è comparso.</li><li><b>CTR</b>: clic ÷ impressioni. Nella ricerca un buon CTR è spesso sopra il 4–5%.</li><li><b>CPC medio</b>: costo medio di un clic.</li><li><b>Conversioni</b>: i risultati che contano (ordini, contatti).</li><li><b>Costo/conv.</b> (CPA): quanto costa in media un risultato.</li><li><b>Punteggio di qualità</b> (1–10): giudizio su CTR previsto, pertinenza dell\'annuncio e pagina di destinazione. Più è alto, meno paghi.</li></ul><p>Il <b>report termini di ricerca</b> mostra cosa hanno scritto davvero le persone: da qui si trovano nuove parole chiave negative.</p>',e:'Guardare solo i clic: una campagna con tanti clic e zero conversioni sta sprecando budget.',p:'Correggi un problema alla volta e ripubblica per vedere l\'effetto.'}
];

const CTA=/\b(chiam[a-z]*|ordin[a-z]*|prenot[a-z]*|scopri[a-z]*|acquist[a-z]*|compr(a|alo|ala|ali|ale|are|ate)|prov(a|alo|ala|ali|are|ate|arla|arlo)|iscriv[a-z]*|richied[a-z]*|contatt[a-z]*|visit(a|ate|ala)|scegli[a-z]*|approfitt[a-z]*|inizi(a|ate)|registr(ati|atevi|arti)|vien[a-z]*|scriv(ici|eteci|ici)|clicca|passa|ricev[a-z]*|ottien[a-z]*|risparmi[a-z]*|fiss(a|ate)|riserv(a|ate)|regal(a|ati)|sfrutt[a-z]*|cogli|non perdere)\b/;

function parseKw(line){let s=line.trim();if(!s)return null;let m='broad';
 if(/^\[.*\]$/.test(s)){m='exact';s=s.slice(1,-1)}else if(/^".*"$/.test(s)){m='phrase';s=s.slice(1,-1)}
 const text=norm(s);if(!text)return null;return{raw:line.trim(),text,m,words:text.split(' ')}}
function parseNeg(txt){return txt.split('\n').map(l=>{const t=norm(l.replace(/[\[\]"]/g,''));return t?{text:t,words:t.split(' ')}:null}).filter(Boolean)}
const blocks=(neg,words)=>neg.words.every(w=>words.includes(w));

function rel(t,sc){
 if(hasWord(t,sc.bad))return 0;
 if(!hasTerm(t,sc.core))return .15;
 let r=.55;if(hasTerm(t,sc.intent))r+=.25;
 if(sc.local){if(hasTerm(t,sc.geo))r+=.2}else r+=.15;
 if(sig(t).length<=1)r*=.65;return Math.min(1,r)}
function volume(t,sc){const wc=sig(t).length;let b=wc<=1?40000:wc==2?8000:wc==3?2500:900;let v=b*sc.scale*jit(t);if(sc.local&&hasTerm(t,sc.geo))v*=.6;return Math.max(10,Math.round(v))}
function baseCpc(t,sc){const wc=sig(t).length;return sc.avgCpc*(wc<=1?1.3:wc==2?1.05:.9)*jit(t+'#',.2)}
function adRel(t,hlWords){const ws=sig(t);if(!ws.length)return 0;const hit=ws.filter(w=>{const s=stem(w);return hlWords.some(h=>h.startsWith(s))}).length/ws.length;return hit>=.75?2:hit>=.34?1:0}
function lpQ(u,sc){u=(u||'').trim();if(!u)return{l:0,m:'URL finale mancante'};
 let x;try{x=new URL(/^https?:\/\//i.test(u)?u:'https://'+u)}catch(e){return{l:0,m:'URL non valido'}}
 const host=x.hostname.replace(/^www\./,'');if(!host.includes('.'))return{l:0,m:'URL non valido'};
 if(host!==sc.domain&&!host.endsWith('.'+sc.domain))return{l:0,m:'dominio diverso da quello del cliente ('+sc.domain+')'};
 const p=x.pathname.replace(/\/+$/,'');if(!p)return{l:1,m:'homepage: meglio una pagina specifica'};
 if(sc.paths.some(q=>p.startsWith(q)))return{l:2,m:'pagina pertinente'};
 return{l:1,m:'pagina non presente nel brief'}}
const LVL3=['Sotto la media','Nella media','Sopra la media'];

function adStrength(H,D,kws,hl){
 const tips=[];
 if(H.length<3||D.length<2){return{lvl:0,label:'Incompleto',p:0,tips:['Servono almeno 3 titoli e 2 descrizioni per pubblicare l\'annuncio.']}}
 let p=Math.min(H.length,8)/8*35+Math.min(D.length,3)/3*20;
 if(H.length<8)tips.push(`Aggiungi titoli: ne hai ${H.length}, punta ad almeno 8.`);
 if(D.length<3)tips.push(`Aggiungi descrizioni: ne hai ${D.length}, punta ad almeno 3.`);
 const kf=kws.length?kws.filter(k=>adRel(k.text,hl)>0).length/kws.length:0;p+=kf*20;
 if(!kws.length)tips.push('Questo gruppo non ha parole chiave.');else if(kf<.6)tips.push('Includi le parole chiave del gruppo nei titoli.');
 const dup=H.length-new Set(H.map(norm)).size;p-=dup*8;if(dup)tips.push('Alcuni titoli sono uguali: rendili unici.');
 const all=norm(H.concat(D).join(' '));if(CTA.test(all))p+=10;else tips.push('Aggiungi un invito all\'azione (Ordina, Prenota, Prova…).');
 const short=H.some(h=>h.length<=20),long=H.some(h=>h.length>=24);if(short&&long)p+=10;else tips.push('Alterna titoli brevi e titoli più lunghi.');
 if(new Set(D.map(norm)).size===D.length)p+=5;
 p=clamp(p,0,100);const lvl=p<40?1:p<62?2:p<82?3:4;
 return{lvl,label:['Incompleto','Scarsa','Media','Buona','Eccellente'][lvl],p,tips}}

const aiCfg=()=>{const c=S.c,on=c.aimax!==false;const txt=on&&c.aiTxt!==false;return{on,stm:on&&c.aiStm!==false,txt,url:txt&&c.aiUrl!==false}};
/* ============ ANALISI ============ */
function analyze(){
 const sc=SC[S.scenario];const negs=parseNeg(S.neg);
 const groups=S.groups.map(g=>{
  const kws=g.kw.split('\n').map(parseKw).filter(Boolean);
  const H=g.h.map(x=>x.trim()).filter(Boolean),D=g.d.map(x=>x.trim()).filter(Boolean);
  const hl=norm(H.join(' ')).split(' ').filter(Boolean);
  const lp=lpQ(g.url,sc);
  const items=kws.map(k=>{
   const r=rel(k.text,sc),ar=adRel(k.text,hl);
   const ec=r>=.9?2:r>=.6?1:0;
   const qs=clamp(Math.round(1+[0,1.75,3.5][ec]+[0,1,2][ar]+[0,1.75,3.5][lp.l]),1,10);
   const blockedBy=negs.find(n=>blocks(n,k.words));
   return{...k,r,ar,ec,qs,blockedBy}});
  return{g,kws:items,H,D,lp,str:adStrength(H,D,kws,hl),valid:H.length>=3&&D.length>=2&&kws.length>0}});
 return{sc,negs,groups}}

function junkFor(k,sc,negs){
 let base=k.m==='exact'?.03:k.m==='phrase'?.18:.45;if(k.m==='broad'&&sig(k.text).length<=1)base+=.12;
 const st=sig(k.text).filter(w=>!hasTerm(w,sc.geo)).map(stem);
 const matched=sc.junk.filter(q=>{if(k.m==='exact')return false;const qw=q.split(' ');
  if(k.m==='phrase')return(' '+q+' ').includes(' '+k.text+' ')||sig(k.text).every(w=>qw.some(x=>x.startsWith(stem(w))));
  return qw.some(x=>st.some(s=>x.startsWith(s)))});
 const open=matched.filter(q=>!negs.some(n=>blocks(n,q.split(' '))));
 const share=k.r===0?1:matched.length?base*(.25+.75*open.length/matched.length):base*.4;
 return{share,matched,open}}

function simulate(A){
 const{sc,negs}=A,c=S.c;
 const daily=num(c.budget),monthly=daily*30.4;
 const L=sc.loc[c.loc]||{r:1,w:0};
 const geoW=Math.min(.96,L.w+(sc.local&&c.locOpt==='pi'?.08:(!sc.local&&c.locOpt==='pi'?.03:0)));
 const lang=(c.lang.includes('it')||c.lang.includes('all'))?1:.08;
 const AS=[0,.8,.9,1,1.1];
 const a=S.a;const slN=a.sl.filter(s=>s.t.trim()&&s.u.trim()).length,coN=a.co.filter(x=>x.trim()).length;
 const assetF=1+(slN>=2?.1:0)+(coN>=2?.05:0)+(a.phone.trim()?.04:0)+(a.snH&&a.snV.split(',').filter(x=>x.trim()).length>=3?.03:0);
 const MM={broad:2.6,phrase:1.4,exact:1},MC={broad:1,phrase:1.1,exact:1.25},LPF=[.45,1,1.15];
 const bid=c.bid,realCpa=sc.avgCpc/sc.cr;
 const rows=[],terms={},other={clicks:0,cost:0,impr:0};
 let tot={impr:0,clicks:0,cost:0,conv:0,relCost:0,junkCost:0,geoCost:0,relClicks:0};
 A.groups.forEach((G,gi)=>{
  if(!G.valid)return;
  G.kws.forEach(k=>{
   if(k.blockedBy){rows.push({k,gi,blocked:true});return}
   const AI=aiCfg(),smart=['maxconv','tcpa','troas'].includes(bid);
   const v=volume(k.text,sc)*lang*L.r,reach=v*MM[k.m]*(AI.stm?1.25:1);
   const need=baseCpc(k.text,sc)*(1.5-.09*k.qs);
   let isB=1,cpcM=1,convM=1,cpc;
   if(bid==='maxclic'){cpcM=.95;convM=.9}
   else if(bid==='maxconv'){isB=.95;cpcM=1.12;convM=1.15}
   else if(bid==='tcpa'){const t=num(c.tcpa);isB=!t?.1:t<realCpa*.6?.25:.6;cpcM=1.05;convM=1.2}
   else if(bid==='troas'){isB=c.goal==='vendite'?.3:.05;convM=1.1}
   else if(bid==='manual'){const b=num(c.maxCpc);isB=b?clamp(Math.pow(b/need,1.5),.03,1):0}
   else isB=0;
   if(AI.stm)convM*=smart?1.07:.93;
   cpc=bid==='manual'?Math.min(num(c.maxCpc)||0,need):need*cpcM;
   const isQ=.45+.055*k.qs;
   const base=reach*isB*isQ;
   const J=junkFor(k,sc,negs);
   const jS=AI.stm?Math.min(.9,J.share*(smart?1.15:1.5)+(k.m==='exact'?.05:.02)):J.share;
   const relI=base*(1-jS),junkI=base*jS,geoI=base*geoW/(1-geoW);
   const ctr=sc.ctr*(.5+.5*k.r)*Math.sqrt(k.qs/7)*AS[G.str.lvl]*assetF*MC[k.m]*(AI.txt?1.04:1);
   const rc=relI*ctr,jc=junkI*ctr*.35,gc=geoI*ctr*.6;
   const conv=rc*sc.cr*Math.max(k.r,.15)*LPF[G.lp.l]*convM*(AI.url?(G.lp.l===2?.97:1.05):1)+gc*sc.cr*.04;
   const pf=c.partners?1.07:1;
   const r={k,gi,impr:(relI+junkI+geoI)*pf,clicks:(rc+jc+gc)*pf,cost:(rc+jc+gc)*cpc*pf,conv:conv*(c.partners?1+.07*.7:1),relCost:rc*cpc*pf,junkCost:jc*cpc*pf,geoCost:gc*cpc*pf,relClicks:rc*pf,cpc,isB};
   rows.push(r);
   const t=terms[k.text]||(terms[k.text]={q:k.text,type:'ok',clicks:0,cost:0,conv:0,from:k.raw});t.clicks+=rc*pf;t.cost+=rc*cpc*pf;t.conv+=conv;
   const toList=jc*pf*.75;J.open.forEach(q=>{const x=terms[q]||(terms[q]={q,type:'junk',clicks:0,cost:0,conv:0,from:k.raw});x.clicks+=toList/J.open.length;x.cost+=toList*cpc/J.open.length});
   if(!J.open.length){other.clicks+=jc*pf;other.cost+=jc*cpc*pf}else{other.clicks+=jc*pf*.25;other.cost+=jc*pf*.25*cpc}
   J.matched.filter(q=>!J.open.includes(q)).forEach(q=>{if(!terms[q])terms[q]={q,type:'blocked',clicks:0,cost:0,conv:0,from:k.raw}});
  })});
 let disp={cost:0,clicks:0,impr:0,conv:0};
 if(c.display&&monthly>0){disp.cost=monthly*.3;disp.clicks=disp.cost/(sc.avgCpc*.35);disp.impr=disp.clicks/.005;disp.conv=disp.clicks*sc.cr*.08}
 const searchBudget=monthly-disp.cost;
 const sCost=rows.reduce((s,r)=>s+(r.cost||0),0);
 const f=sCost>searchBudget&&sCost>0?Math.max(0,searchBudget)/sCost:1;
 const sc2=r=>{['impr','clicks','cost','conv','relCost','junkCost','geoCost','relClicks'].forEach(x=>{if(r[x]!=null)r[x]*=f})};
 rows.forEach(r=>{if(!r.blocked)sc2(r)});Object.values(terms).forEach(t=>{t.clicks*=f;t.cost*=f;t.conv*=f});other.clicks*=f;other.cost*=f;
 rows.forEach(r=>{if(r.blocked)return;tot.impr+=r.impr;tot.clicks+=r.clicks;tot.cost+=r.cost;tot.conv+=r.conv;tot.relCost+=r.relCost;tot.junkCost+=r.junkCost;tot.geoCost+=r.geoCost});
 tot.impr+=disp.impr;tot.clicks+=disp.clicks;tot.cost+=disp.cost;tot.conv+=disp.conv;
 const termList=Object.values(terms).sort((x,y)=>(x.type==='blocked')-(y.type==='blocked')||y.cost-x.cost);
 if(other.clicks>0.5)termList.push({q:'altre ricerche poco pertinenti (varie)',type:'junk',clicks:other.clicks,cost:other.cost,conv:0,from:'corrispondenza generica / a frase'});
 return{rows,tot,disp,monthly,daily,limited:f<.98,f,terms:termList,geoW,assetF}}

const PER_SC=['c','groups','neg','a','attempts','history','result','maxStep'];
function switchScenario(id){
 if(S.scenario===id)return;
 S.saved=S.saved||{};
 if(S.scenario)S.saved[S.scenario]=JSON.parse(JSON.stringify(Object.fromEntries(PER_SC.map(k=>[k,S[k]]))));
 const f=fresh(),snap=S.saved[id];

}

 S.attempts++;S.history.push(G.total);
 S.result={total:G.total,cats:G.cats,tot:{...R.tot,dispCost:R.disp.cost},limited:R.limited,kwRows,terms:R.terms.slice(0,25),dispClicks:R.disp.clicks,dispConv:R.disp.conv};
 S.step=8;render();window.scrollTo({top:0});

/* ===== Sigle spiegate dove compaiono ===== */
const DEFS={'CPM':'Costo per mille impressioni: quanto paghi ogni 1.000 volte che l\'annuncio viene mostrato.','CPC':'Costo per clic: quanto paghi in media per ogni clic.','CTR':'Percentuale di clic: clic diviso impressioni. Indica quanto l\'annuncio invoglia a cliccare.','CPA':'Costo per acquisizione: quanto costa in media un risultato (una vendita, un contatto).','ROAS':'Ritorno sulla spesa pubblicitaria: valore delle vendite diviso spesa. ROAS 3 = 3 € incassati per ogni euro speso.','ThruPlay':'Visualizzazione del video fino alla fine (o per almeno 15 secondi).','Advantage+':'Le automazioni di Meta: budget, pubblico o posizionamenti gestiti dall\'algoritmo.','Spark Ads':'Annunci TikTok che promuovono un post già pubblicato, mantenendo like e commenti.','pixel':'Codice installato sul sito che comunica alla piattaforma cosa fanno le persone (acquisti, contatti).','Pangle':'Rete di app di terze parti in cui TikTok può mostrare gli annunci.','UTM':'Parametri aggiunti al link per riconoscere da dove arriva il traffico in Google Analytics.','remarketing':'Mostrare annunci a chi ha già visitato il sito o interagito con il brand.','Punteggio di qualità':'Voto da 1 a 10 che Google dà a una parola chiave: più è alto, meno paghi ogni clic.','AI Max':'Funzioni di Google che ampliano le ricerche oltre le parole chiave e personalizzano titoli e link.','Frequenza':'Quante volte, in media, ogni persona ha visto l\'annuncio.','Copertura':'Numero di persone diverse che hanno visto l\'annuncio almeno una volta.','lead':'Contatto di una persona interessata: nome, telefono o email.','impressioni':'Le volte in cui l\'annuncio è stato mostrato.','Rete Display':'Banner e annunci su siti e app: li vede chi naviga, non chi sta cercando.','sitelink':'Link aggiuntivi sotto l\'annuncio che portano ad altre pagine del sito.','callout':'Brevi frasi sui punti di forza mostrate sotto l\'annuncio, es. "Consegna gratuita".','corrispondenza':'Quanto le ricerche reali possono essere diverse dalla tua parola chiave: generica, a frase o esatta.','parole chiave negative':'Termini che escludono le ricerche che non vuoi, es. "lavoro" o "ricetta".'};
const _TK=Object.keys(DEFS).sort((a,b)=>b.length-a.length);
const _TRX=new RegExp('(^|[^A-Za-zÀ-ÿ0-9])('+_TK.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![A-Za-zÀ-ÿ0-9])','i');
function markTerms(){const used=new Set();const roots=[document.getElementById('view'),document.getElementById('help')].filter(Boolean);
 const skip='input,textarea,select,option,button,script,style,.term,.serp,.post,.phone,.story,#pvFeed,#pvStory,a,h1,.brand,.kw,.mt,.tag';
 roots.forEach(root=>{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.trim()&&n.parentElement&&n.parentElement.offsetParent!==null&&!n.parentElement.closest(skip)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(node=>{let txt=node.nodeValue;const frag=document.createDocumentFragment();let changed=false;
   for(let guard=0;guard<6;guard++){const m=_TRX.exec(txt);if(!m)break;const key=_TK.find(k=>k.toLowerCase()===m[2].toLowerCase());if(used.has(key)){const cut=m.index+m[0].length;frag.appendChild(document.createTextNode(txt.slice(0,cut)));txt=txt.slice(cut);changed=true;continue}
    used.add(key);const start=m.index+m[1].length;frag.appendChild(document.createTextNode(txt.slice(0,start)));const sp=document.createElement('span');sp.className='term';sp.tabIndex=0;sp.dataset.def=DEFS[key];sp.textContent=m[2];frag.appendChild(sp);txt=txt.slice(start+m[2].length);changed=true}
   if(changed){frag.appendChild(document.createTextNode(txt));node.parentNode.replaceChild(frag,node)}})})}
(function(){const tip=document.createElement('div');tip.id='tip';tip.setAttribute('role','tooltip');document.body.appendChild(tip);let cur=null;
 let shownAt=0,lastTouch=0;document.addEventListener('touchstart',()=>{lastTouch=Date.now()},{passive:true,capture:true});const show=el=>{cur=el;shownAt=Date.now();tip.textContent=el.dataset.def;tip.style.display='block';const r=el.getBoundingClientRect();const tw=Math.min(280,window.innerWidth-24);tip.style.maxWidth=tw+'px';let x=r.left+window.scrollX;x=Math.min(x,window.scrollX+window.innerWidth-tip.offsetWidth-12);x=Math.max(window.scrollX+12,x);tip.style.left=x+'px';tip.style.top=(r.bottom+window.scrollY+6)+'px'};
 const hide=()=>{cur=null;tip.style.display='none'};
 document.addEventListener('mouseover',e=>{if(Date.now()-lastTouch<1000)return;const t=e.target.closest&&e.target.closest('.term');if(t)show(t)});
 document.addEventListener('mouseout',e=>{if(Date.now()-lastTouch<1000)return;const t=e.target.closest&&e.target.closest('.term');if(t)hide()});
 document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('term'))show(e.target)});
 document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('term'))hide()});
 document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('.term');if(t){e.preventDefault();e.stopPropagation();if(cur===t&&Date.now()-shownAt>500)hide();else show(t)}else if(cur)hide()},true);
 window.addEventListener('scroll',()=>{if(cur)hide()},{passive:true});})();
